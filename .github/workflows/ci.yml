name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - fix/oauth-onboarding-real-sync

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Test suite
        run: npm test

      - name: Production build
        run: npm run build
